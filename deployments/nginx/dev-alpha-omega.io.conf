# This is the sample of Nginx virtual host config. Please change to your own environment settings!

# ---------------------------------------------------------------------------
# Upstream: Alpha Omega API  (Go — REST + OIDC)
# ---------------------------------------------------------------------------
upstream ao_api {
    server 127.0.0.1:8080;
    keepalive 32;
}
 
# ---------------------------------------------------------------------------
# Upstream: Alpha Omega Login UI  (Next.js — /ui/v1/* paths)
# ---------------------------------------------------------------------------
upstream ao_login {
    server 127.0.0.1:3000;
    keepalive 16;
}

# ---------------------------------------------------------------------------
# Upstream: Alpha Omega User Portal  (Next.js)
# ---------------------------------------------------------------------------
upstream ao_user_portal {
    server 127.0.0.1:3001;
    keepalive 16;
}

# ---------------------------------------------------------------------------
# Upstream: Alpha Omega Admin Console  (Next.js)
# ---------------------------------------------------------------------------
upstream ao_admin_console {
    server 127.0.0.1:3002;
    keepalive 16;
}

# ===========================================================================
# SERVER BLOCK (API + Login UI) — HTTP  →  HTTPS redirect
# ===========================================================================
server {
    listen 80;
    server_name dev-ao.alpha-omega.io;

    # Redirect all traffic to HTTPS
    return 301 https://$host$request_uri;
}

# ===========================================================================
# SERVER BLOCK (API + Login UI) — HTTPS  (TLS termination + reverse proxy)
# ===========================================================================
server {
    listen 443 ssl;
    http2 on;
    server_name dev-ao.alpha-omega.io;
    charset utf-8;
	
	# Enable SSL
    ssl_certificate "C:/laragon/etc/nginx/certs/alpha-omega.io/fullchain.pem";
    ssl_certificate_key "C:/laragon/etc/nginx/certs/alpha-omega.io/privkey.pem";
    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
	
	# Security Header
	add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
	add_header Strict-Transport-Security "max-age=63072000; includeSubDomains";
	server_tokens off;
	
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
	
	location ~ /\.ht {
		deny all;
	}
	
	location ~ /\.git {
		deny all;
		return 404;
	}
	
	# =========================================================================
    # LOCATION 1 — Login UI  (/ui/v1/*)
    #
    # The Next.js Login UI owns all paths under /ui/v1/.
    # Alpha Omega redirects every authentication flow here.
    # =========================================================================
    location ^~ /ui/v1/ {
        proxy_pass http://ao_login;
 
		# Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
		
		proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
 
        # Prevent nginx from rewriting Location headers returned by Next.js
        proxy_redirect off;
    }
	
	# Next.js static assets (JS chunks, CSS, fonts)
    location ^~ /_next/ {
        proxy_pass http://ao_login;
		proxy_http_version 1.1;
 
        # Cache immutable Next.js hashed assets aggressively
        #proxy_cache_valid 200 7d;
        #add_header Cache-Control "public, max-age=604800, immutable";
    }
	
	# =========================================================================
    # LOCATION 2 — catch-all  (REST, OIDC)
    # =========================================================================
    location / {
        proxy_pass http://ao_api;

		# Standard Proxy Headers. The gateway trusts these ONLY from this proxy
		# (Server.TrustedProxies / AO_SERVER_TRUSTED_PROXIES), so they MUST be
		# set here, never forwarded from the client:
		#   - X-Forwarded-Host selects the tenant (c.Hostname()); we pin it to $host.
		#   - X-Forwarded-For is the rate-limit key + session audit IP (c.IP()); we
		#     OVERWRITE it with $remote_addr (the real client) rather than using
		#     $proxy_add_x_forwarded_for, which would prepend any client-sent value
		#     and let a caller spoof its source IP.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ===========================================================================
# SERVER BLOCK (User Portal UI) — HTTP  →  HTTPS redirect
# ===========================================================================
server {
    listen 80;
    server_name dev-portal.alpha-omega.io;

    # Redirect all traffic to HTTPS
    return 301 https://$host$request_uri;
}

# ===========================================================================
# SERVER BLOCK (User Portal UI) — HTTPS  (TLS termination + reverse proxy)
# ===========================================================================
server {
    listen 443 ssl;
    http2 on;
    server_name dev-portal.alpha-omega.io;
    charset utf-8;
	
	# Enable SSL
    ssl_certificate "C:/laragon/etc/nginx/certs/alpha-omega.io/fullchain.pem";
    ssl_certificate_key "C:/laragon/etc/nginx/certs/alpha-omega.io/privkey.pem";
    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
	
	# Security Header
	add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
	add_header Strict-Transport-Security "max-age=63072000; includeSubDomains";
	server_tokens off;
	
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
    location ~ /\.ht {
        deny all;
    }
	
	location / {
        # The internal address/port of your application
        proxy_pass http://ao_user_portal; 
        
        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Optional: Handle WebSockets
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}


